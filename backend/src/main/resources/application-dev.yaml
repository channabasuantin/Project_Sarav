spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sankalpa
    username: ${DB_USERNAME:${USER}}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
